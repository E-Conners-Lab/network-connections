<!doctype html><meta charset="utf-8"><title>tests</title><pre id="out">running</pre>
<script type="module">
import * as C from '../js/connections-core.js';
const results = []; let pass = 0, fail = 0;
function t(name, fn) { try { fn(); pass++; } catch (e) { fail++; results.push('FAIL ' + name + ': ' + e.message); } }
function eq(a, b) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

const { puzzles } = await (await fetch('../data/puzzles.json')).json();
const P = puzzles[0];                                  // Network Basics
const pick = (g, gi) => P.groups[gi].items.forEach((it) => C.toggle(g, it));
const game = (seed = 1) => C.newGame(P, C.rng(seed));

// ---- shipped puzzles ----
t('eight puzzles ship, ids 1..8 in order', () => { eq(puzzles.length, 8); eq(puzzles.map((p) => p.id), [1, 2, 3, 4, 5, 6, 7, 8]); });
puzzles.forEach((p) => t(`puzzle ${p.id} "${p.title}" is valid`, () => { const e = C.validatePuzzle(p); if (e.length) throw new Error(e.join('; ')); }));
t('puzzle titles are unique', () => eq(new Set(puzzles.map((p) => p.title)).size, 8));
t('no item is blank, and every why is a sentence', () => puzzles.forEach((p) => p.groups.forEach((g) => { if (g.why.length < 15) throw new Error(g.name); })));

// ---- validator rejects bad data ----
const clone = () => JSON.parse(JSON.stringify(P));
t('validator: three groups', () => { const p = clone(); p.groups.pop(); if (!C.validatePuzzle(p).length) throw new Error('accepted'); });
t('validator: duplicate item across groups', () => { const p = clone(); p.groups[1].items[0] = p.groups[0].items[0]; if (!C.validatePuzzle(p).some((e) => e.includes('appears in'))) throw new Error('missed'); });
t('validator: duplicate differing only by case', () => { const p = clone(); p.groups[1].items[0] = p.groups[0].items[0].toLowerCase(); if (!C.validatePuzzle(p).length) throw new Error('missed'); });
t('validator: group with 3 items', () => { const p = clone(); p.groups[2].items.pop(); if (!C.validatePuzzle(p).length) throw new Error('missed'); });
t('validator: missing why or name', () => { const p = clone(); p.groups[0].why = ''; p.groups[1].name = ' '; eq(C.validatePuzzle(p).length, 2); });
t('newGame refuses an invalid puzzle', () => { const p = clone(); p.groups.pop(); let threw = false; try { C.newGame(p); } catch { threw = true; } eq(threw, true); });

// ---- rules ----
t('new game: 16 distinct tiles, nothing selected, 4 mistakes left', () => { const g = game(); eq(g.tiles.length, 16); eq(new Set(g.tiles).size, 16); eq(g.selected, []); eq(C.mistakesLeft(g), 4); });
t('shuffle with the same seed is reproducible, with another seed differs', () => { eq(game(3).tiles, game(3).tiles); if (JSON.stringify(game(3).tiles) === JSON.stringify(game(4).tiles)) throw new Error('same order'); });
t('toggle selects, deselects, and caps at four', () => {
  const g = game(); const [a, b, c, d, e] = g.tiles;
  [a, b, c, d].forEach((x) => eq(C.toggle(g, x), true)); eq(g.selected.length, 4);
  eq(C.toggle(g, e), false); eq(g.selected.length, 4);
  eq(C.toggle(g, a), true); eq(g.selected.length, 3);
  eq(C.toggle(g, 'not a tile'), false);
});
t('submit with fewer than four is incomplete and free', () => { const g = game(); C.toggle(g, g.tiles[0]); eq(C.submit(g).type, 'incomplete'); eq(g.mistakes, 0); });
t('a correct group is solved, removed and clears the selection', () => {
  const g = game(); pick(g, 0); const r = C.submit(g);
  eq(r, { type: 'correct', group: 0 }); eq(g.tiles.length, 12); eq(g.selected, []); eq(g.solved, [0]); eq(g.mistakes, 0);
  P.groups[0].items.forEach((it) => { if (g.tiles.includes(it)) throw new Error('still in play'); });
});
t('a 2+2 guess is a plain mistake', () => {
  const g = game(); [...P.groups[0].items.slice(0, 2), ...P.groups[1].items.slice(0, 2)].forEach((it) => C.toggle(g, it));
  eq(C.submit(g).type, 'wrong'); eq(g.mistakes, 1); eq(g.msg, 'Not quite.'); eq(g.selected.length, 4);
});
t('a 3+1 guess says one away', () => {
  const g = game(); [...P.groups[2].items.slice(0, 3), P.groups[3].items[0]].forEach((it) => C.toggle(g, it));
  eq(C.submit(g).type, 'one-away'); eq(g.msg, 'One away!'); eq(g.mistakes, 1);
});
t('a 1+1+1+1 guess is a plain mistake, not one away', () => {
  const g = game(); P.groups.forEach((gr) => C.toggle(g, gr.items[0])); eq(C.submit(g).type, 'wrong');
});
t('repeating a guess is free', () => {
  const g = game(); const set = [...P.groups[0].items.slice(0, 2), ...P.groups[1].items.slice(0, 2)];
  set.forEach((it) => C.toggle(g, it)); C.submit(g);
  C.deselectAll(g); set.slice().reverse().forEach((it) => C.toggle(g, it));
  eq(C.submit(g).type, 'duplicate'); eq(g.mistakes, 1);
});
t('four mistakes lose and reveal the unsolved groups in order', () => {
  const g = game(); pick(g, 1); C.submit(g);
  const bad = [[0, 2], [0, 3], [2, 3], [0, 2, 3]];
  const tries = [[P.groups[0].items[0], P.groups[0].items[1], P.groups[2].items[0], P.groups[2].items[1]],
                 [P.groups[0].items[0], P.groups[0].items[1], P.groups[3].items[0], P.groups[3].items[1]],
                 [P.groups[2].items[0], P.groups[2].items[1], P.groups[3].items[0], P.groups[3].items[1]],
                 [P.groups[0].items[2], P.groups[0].items[3], P.groups[2].items[2], P.groups[2].items[3]]];
  tries.forEach((s) => { C.deselectAll(g); s.forEach((it) => C.toggle(g, it)); C.submit(g); });
  eq(g.lost, true); eq(g.won, false); eq(g.mistakes, 4); eq(g.revealed, [0, 2, 3]);
  eq(C.toggle(g, g.tiles[0]), false); eq(C.submit(g).type, 'over');
});
t('solving all four wins, any order', () => { const g = game(7); [3, 1, 0, 2].forEach((gi) => { pick(g, gi); C.submit(g); }); eq(g.won, true); eq(g.tiles.length, 0); eq(g.solved, [3, 1, 0, 2]); });
t('shuffle keeps the same tiles and the selection', () => {
  const g = game(); C.toggle(g, g.tiles[0]); const sel = g.selected.slice(); const before = g.tiles.slice().sort();
  C.shuffle(g); eq(g.tiles.slice().sort(), before); eq(g.selected, sel);
});
t('shareText: one row of four squares per guess, header and outcome', () => {
  const g = game(); pick(g, 0); C.submit(g);
  [...P.groups[1].items.slice(0, 3), P.groups[2].items[0]].forEach((it) => C.toggle(g, it)); C.submit(g);
  const lines = C.shareText(g).split('\n');
  eq(lines[0], 'Network Connections #1 Network Basics'); eq(lines[1], 'Not solved');
  eq(lines[2], '\u{1F7E8}'.repeat(4)); eq(lines[3], '\u{1F7E9}'.repeat(3) + '\u{1F7E6}'); eq(lines.length, 4);
  [1, 2, 3].forEach((gi) => { C.deselectAll(g); pick(g, gi); C.submit(g); });
  eq(C.shareText(g).split('\n')[1], 'Solved with 1 mistake');
});
t('every puzzle can be solved through the engine', () => puzzles.forEach((p) => {
  const g = C.newGame(p, C.rng(p.id)); p.groups.forEach((gr) => { gr.items.forEach((it) => C.toggle(g, it)); eq(C.submit(g).type, 'correct'); });
  eq(g.won, true);
}));

document.getElementById('out').textContent = `RESULT pass=${pass} fail=${fail}\n` + results.join('\n');
</script>
